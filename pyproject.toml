[tool.ruff]
line-length = 88
target-version = "py312"   # D-001: Python 3.12

[tool.ruff.lint]
# E, W: PEP 8
# F: lỗi logic cơ bản
# I: thứ tự import
# ANN: type hint
select = ["E", "W", "F", "I", "ANN"]

[tool.ruff.lint.per-file-ignores]
# D-009: miễn nhóm ANN cho file test
"tests/test_*.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
check_untyped_defs = true
